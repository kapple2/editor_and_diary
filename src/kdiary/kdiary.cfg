# KDIARY: one binary at $4000 (BRUN KDIARY): CODE, RODATA, then SPLASH (the start picture and its decoder).
# BSS is not in the file. It starts where SPLASH starts: the editor's line arrays, which are not used before the
# first password is accepted, lie over the picture, which is not used after it. The text space starts where BSS
# ends (label bufmem) and runs to HIMEM.
MEMORY {
    MAIN: start = $4000, size = $5400, file = "build/KDIARY.bin";
    VARS: start = __SPLASH_RUN__, size = $1400, file = "";
}
SEGMENTS {
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    SPLASH: load = MAIN, type = ro, define = yes;
    BSS:    load = VARS, type = bss, define = yes;
}
