# KEDIT: one binary at $4000 (BRUN KEDIT). BSS follows the code and is not in the file; the text buffer starts
# where BSS ends (label bufmem) and runs to HIMEM.
MEMORY {
    MAIN: start = $4000, size = $5400, file = "build/KEDIT.bin";
}
SEGMENTS {
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    BSS:    load = MAIN, type = bss, define = yes;
}
